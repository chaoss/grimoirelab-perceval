---
title: Credentials from secrets managers when used as a library
category: added
author: Santiago Dueñas <sduenas@grimoirelab.org>
issue: null
notes: >
  `BackendItemsGenerator` and `fetch` accept a credential
  manager and the name of a secret. The credentials stored in
  that secret are retrieved before the backend is initialized,
  so applications that use Perceval as a library don't need
  to handle them. The new module `perceval.credentials` also
  provides `build_credential_manager` to create Bitwarden and
  HashiCorp Vault managers.
