---
title: API tokens from secrets managers
category: fixed
author: Santiago Dueñas <sduenas@grimoirelab.org>
issue: null
notes: >
  API tokens retrieved from a secrets manager were always
  passed to the backends as a list. Only GitHub and GitHubQL
  accept a list of tokens, so backends like GitLab, Gitter,
  Jenkins or Confluence failed to authenticate. Now, tokens
  are only converted into a list for backends that accept a
  pool of tokens. For these backends, several tokens can be
  stored in the secret separated by commas or new lines.
  Empty credentials in the secret produce an error instead
  of running the backend without authentication.
